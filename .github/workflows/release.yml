name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs always exercise the pipeline without publishing to GHCR or PyPI.
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/keystone-codes/keystone-mcp

permissions:
  contents: read

jobs:
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"

      # On a real tag push, GITHUB_REF_NAME is the tag (vX.Y.Z) and must
      # agree with the version sources. On workflow_dispatch, GITHUB_REF_NAME
      # is the branch name, so --tag is omitted and only the file sources
      # are checked against each other.
      - name: Check version consistency with tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run --no-project --python 3.12 python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            uv run --no-project --python 3.12 python scripts/check_version.py
          fi

  # Full test gate runs on master via CI; avoid duplicating the matrix on tag push.
  build-dist:
    name: Build and check the PyPI distribution
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"

      - name: Build wheel and sdist
        run: uv build

      - name: Check the built wheel and sdist
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run --no-project --python 3.12 python scripts/check_version.py --tag "${GITHUB_REF_NAME}" --dist-dir dist
          else
            uv run --no-project --python 3.12 python scripts/check_version.py --dist-dir dist
          fi

      - name: Refuse a version that is already on PyPI
        if: github.event_name == 'push'
        run: |
          v="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/keystone-mcp-gateway/$v/json")
          if [ "$code" = "200" ]; then echo "keystone-mcp-gateway $v is already on PyPI"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  wheel-smoke:
    name: Wheel smoke test
    needs: build-dist
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the built wheel into a clean virtualenv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      - name: Smoke test the installed wheel
        run: bash scripts/smoke_wheel.sh /tmp/venv/bin/keystone-mcp

  image-build:
    name: Build and push image digest
    needs: version-gate
    if: github.event_name == 'push' && vars.SKIP_GHCR_PUSH != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_PREFIX }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  image-scan:
    name: Image scan (${{ matrix.platform }})
    needs: image-build
    if: github.event_name == 'push' && vars.SKIP_GHCR_PUSH != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same action, pin and parameters as .github/workflows/security.yml's
      # image-scan job (see the comment there) — the release path must not be
      # able to tag an image the PR gate would have rejected.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}@${{ needs.image-build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Log scanned digest
        run: |
          echo "scanned ${{ needs.image-build.outputs.digest }} for ${{ matrix.platform }}"

  image-smoke:
    name: Image smoke test
    needs: image-build
    if: github.event_name == 'push' && vars.SKIP_GHCR_PUSH != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull amd64 image for smoke test
        run: docker pull --platform linux/amd64 "${IMAGE_PREFIX}@${{ needs.image-build.outputs.digest }}"

      - name: Smoke test amd64 image
        run: bash scripts/smoke_image.sh "${IMAGE_PREFIX}@${{ needs.image-build.outputs.digest }}"

  image-dry-run:
    name: Image build and scan (no publish)
    needs: version-gate
    if: github.event_name != 'push' || vars.SKIP_GHCR_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build OCI archive (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image.tar
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Scan OCI archive with Trivy (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
        env:
          TRIVY_PLATFORM: linux/amd64

      - name: Scan OCI archive with Trivy (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
        env:
          TRIVY_PLATFORM: linux/arm64

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: keystone-mcp:smoke
          cache-from: type=gha

      - name: Smoke test amd64 image
        run: bash scripts/smoke_image.sh keystone-mcp:smoke

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.4

      - name: Package Helm chart (dry run)
        run: |
          set -euo pipefail
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          helm package charts/keystone-mcp --version "$version" --app-version "$version"
          packaged="$(helm show chart "keystone-mcp-${version}.tgz" | awk '/^version:/ {print $2}')"
          if [ "$packaged" != "$version" ]; then
            echo "Packaged chart version ${packaged} != project version ${version}"
            exit 1
          fi

  publish:
    name: Tag published image digest
    needs: [version-gate, image-build, image-scan, image-smoke]
    if: github.event_name == 'push' && vars.SKIP_GHCR_PUSH != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ needs.image-build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this tag is the highest release
        id: latest
        run: |
          git fetch --tags --force
          highest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ "${GITHUB_REF_NAME}" = "${highest}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}

      - name: Tag the pushed digest
        run: |
          tags="${{ steps.meta.outputs.tags }}"
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            args+=("-t" "${tag}")
          done <<< "${tags}"
          docker buildx imagetools create "${args[@]}" "${IMAGE_PREFIX}@${{ needs.image-build.outputs.digest }}"

      - name: Verify published manifest digest
        run: |
          version="${GITHUB_REF_NAME#v}"
          published="$(docker buildx imagetools inspect "${IMAGE_PREFIX}:${version}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          expected="${{ needs.image-build.outputs.digest }}"
          if [ "${published}" != "${expected}" ]; then
            echo "Published digest ${published} does not match built digest ${expected}"
            exit 1
          fi

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.4

      - name: Package Helm chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package charts/keystone-mcp --version "$version" --app-version "$version"
          packaged="$(helm show chart "keystone-mcp-${version}.tgz" | awk '/^version:/ {print $2}')"
          if [ "$packaged" != "$version" ]; then
            echo "Packaged chart version ${packaged} != tag version ${version}"
            exit 1
          fi

      - name: Refuse a chart version that is already on GHCR
        run: |
          version="${GITHUB_REF_NAME#v}"
          if helm show chart "oci://ghcr.io/keystone-codes/charts/keystone-mcp" --version "$version" >/dev/null 2>&1; then
            echo "Helm chart keystone-mcp ${version} is already published to GHCR"
            exit 1
          fi

      - name: Publish Helm chart to GHCR
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "keystone-mcp-${version}.tgz" oci://ghcr.io/keystone-codes/charts

  pypi:
    name: Publish to PyPI
    needs: [wheel-smoke, publish]
    if: github.event_name == 'push' && vars.SKIP_PYPI_PUBLISH != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    needs: [publish, pypi, image-build]
    # Do not publish release notes when PyPI failed — the tag would promise a package that was never uploaded.
    if: always() && needs.publish.result == 'success' && needs.pypi.result != 'failure' && needs.pypi.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" > release-notes.md
          echo "" >> release-notes.md
          echo "Image: ${IMAGE_PREFIX}:${GITHUB_REF_NAME#v} (linux/amd64, linux/arm64), digest ${{ needs.image-build.outputs.digest }}" >> release-notes.md
          if [ "${{ needs.pypi.result }}" = "success" ]; then
            echo "PyPI: https://pypi.org/project/keystone-mcp-gateway/${GITHUB_REF_NAME#v}/" >> release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "keystone-mcp ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
