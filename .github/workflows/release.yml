name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Exercise the release pipeline without publishing anything:
          version-gate and build-dist run without --tag, the "already on
          PyPI" check is skipped, and publish, pypi and github-release do
          not run.
        type: boolean
        default: true

env:
  IMAGE_PREFIX: ghcr.io/keystone-codes/keystone-mcp

permissions:
  contents: read

jobs:
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # On a real tag push, GITHUB_REF_NAME is the tag (vX.Y.Z) and must
      # agree with the version sources. On a manual workflow_dispatch run
      # (dry run), GITHUB_REF_NAME is just the branch name, so --tag is
      # omitted and only the file sources are checked against each other.
      - name: Check version consistency with tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run --no-project --python 3.12 python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            uv run --no-project --python 3.12 python scripts/check_version.py
          fi

  test:
    needs: version-gate
    uses: ./.github/workflows/test-gate.yml

  image-scan:
    name: Image scan
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t keystone-mcp:scan .

      # Same action, pin and parameters as .github/workflows/security.yml's
      # image-scan job (see the comment there) — the release path must not be
      # able to publish an image the PR gate would have rejected. A fixable
      # CRITICAL or HIGH finding fails this job and blocks `publish` below.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: keystone-mcp:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore

  build-dist:
    name: Build and check the PyPI distribution
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build wheel and sdist
        run: uv build

      # Same --tag rule as version-gate above: a dry run has no release tag
      # to check the dist filenames and METADATA against.
      - name: Check the built wheel and sdist
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run --no-project --python 3.12 python scripts/check_version.py --tag "${GITHUB_REF_NAME}" --dist-dir dist
          else
            uv run --no-project --python 3.12 python scripts/check_version.py --dist-dir dist
          fi

      - name: Refuse a version that is already on PyPI
        if: github.event_name == 'push'
        run: |
          v="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/keystone-mcp-gateway/$v/json")
          if [ "$code" = "200" ]; then echo "keystone-mcp-gateway $v is already on PyPI"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  wheel-smoke:
    name: Wheel smoke test
    needs: build-dist
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the built wheel into a clean virtualenv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      - name: Smoke test the installed wheel
        run: bash scripts/smoke_wheel.sh /tmp/venv/bin/keystone-mcp

  publish:
    name: Build and publish image
    needs: [version-gate, test, image-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GHCR push uses the workflow GITHUB_TOKEN (packages: write above).
      # For forks or environments without registry access, set repository variable
      # SKIP_GHCR_PUSH=true to build both platforms locally without pushing.
      - name: Resolve publish mode
        id: publish
        run: |
          if [ "${{ vars.SKIP_GHCR_PUSH }}" = "true" ]; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "mode=push" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Multi-platform builds cannot be loaded into the local Docker engine
      # (`load: true` only works for a single platform), so the image that is
      # actually started and probed below is amd64-only. The arm64 build that
      # follows reuses this build's cache (`cache-from/to: type=gha`) and is
      # only checked for a successful build, never run (arm64 under QEMU is
      # too slow to run tests against; see the task card).
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: keystone-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64 image
        run: bash scripts/smoke_image.sh keystone-mcp:smoke

      - name: Log in to GHCR
        if: steps.publish.outputs.mode == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.publish.outputs.mode == 'push'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        if: steps.publish.outputs.mode == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      # SKIP_GHCR_PUSH or no registry access (e.g. a fork): still prove that
      # the arm64 build succeeds, just without publishing anything.
      - name: Build-only smoke (linux/amd64, linux/arm64)
        if: steps.publish.outputs.mode == 'smoke'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          provenance: true
          sbom: true

  pypi:
    name: Publish to PyPI
    needs: [test, wheel-smoke, publish]
    # Only on a real tag push (never a dry run), after the image is
    # published, so the image and the package always carry the same
    # version. SKIP_PYPI_PUBLISH=true (e.g. a fork without a trusted
    # publisher configured) skips this job without failing it.
    if: github.event_name == 'push' && vars.SKIP_PYPI_PUBLISH != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing; no API token in secrets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    needs: [publish, pypi]
    # pypi may legitimately be skipped (SKIP_PYPI_PUBLISH=true, or this run
    # is a dry run and publish itself was skipped); only a failed publish
    # (the image) should block the GitHub Release.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" > release-notes.md
          echo "" >> release-notes.md
          echo "Image: ${IMAGE_PREFIX}:${GITHUB_REF_NAME#v} (linux/amd64, linux/arm64)" >> release-notes.md
          if [ "${{ needs.pypi.result }}" = "success" ]; then
            echo "PyPI: https://pypi.org/project/keystone-mcp-gateway/${GITHUB_REF_NAME#v}/" >> release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "keystone-mcp ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
