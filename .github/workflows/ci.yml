name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test-gate.yml

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: test
    env:
      HELM_VERSION: v3.16.4
      KUBECONFORM_VERSION: v0.6.7
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
      KEYSTONE_REQUIRE_HELM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Lint and render chart value sets
        run: |
          set -euo pipefail
          for values in charts/keystone-mcp/ci/*.yaml; do
            case "${values}" in
              *hello-upstream.yaml) continue ;;
            esac
            echo "==> helm lint --strict -f ${values}"
            helm lint charts/keystone-mcp --strict -f "${values}"
            echo "==> helm template -f ${values}"
            helm template test charts/keystone-mcp -f "${values}" | tee /tmp/rendered.yaml
            kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas /tmp/rendered.yaml
          done

      - name: Helm chart tests
        run: uv run --extra dev pytest tests/test_helm_chart.py -q

  helm-kind-changes:
    name: Helm kind path filter
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    outputs:
      helm_kind: ${{ steps.decide.outputs.helm_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            helm_kind:
              - 'charts/**'
              - 'Dockerfile'
              - 'src/**'
              - 'scripts/smoke_demo.py'
      - name: Decide whether helm-kind runs
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "helm_kind=true" >> "$GITHUB_OUTPUT"
          else
            echo "helm_kind=${{ steps.filter.outputs.helm_kind }}" >> "$GITHUB_OUTPUT"
          fi

  helm-kind:
    name: Helm kind smoke
    runs-on: ubuntu-latest
    needs: [test, helm-kind-changes]
    if: |
      always() && needs.test.result == 'success' &&
      needs.helm-kind-changes.result == 'success' &&
      needs.helm-kind-changes.outputs.helm_kind == 'true'
    timeout-minutes: 20
    env:
      HELM_VERSION: v3.16.4
      KIND_VERSION: v0.26.0
      NODE_IMAGE: kindest/node:v1.30.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.NODE_IMAGE }}
          cluster_name: keystone-mcp-f13

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Build and load images
        run: |
          set -euo pipefail
          docker build -t keystone-mcp:ci .
          docker build -t keystone-hello-upstream:ci examples/hello-upstream
          kind load docker-image --name keystone-mcp-f13 keystone-mcp:ci
          kind load docker-image --name keystone-mcp-f13 keystone-hello-upstream:ci

      - name: Deploy hello-upstream
        run: kubectl apply -f charts/keystone-mcp/ci/hello-upstream.yaml

      - name: Helm install
        run: |
          helm install keystone charts/keystone-mcp \
            -f charts/keystone-mcp/values-kind.yaml \
            --set image.repository=keystone-mcp \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 5m

      - name: Port-forward and wait for readyz
        id: pf
        run: |
          set -euo pipefail
          nohup kubectl port-forward svc/keystone-keystone-mcp 8080:80 > /tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/readyz; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "timed out waiting for /readyz"
          exit 1

      - name: Demo smoke
        run: >-
          uv run python scripts/smoke_demo.py
          --dev-token demo-token
          --admin-email admin@example.com

      - name: Helm upgrade to three replicas
        run: helm upgrade keystone charts/keystone-mcp -f charts/keystone-mcp/values-kind.yaml --set replicaCount=3 --set image.repository=keystone-mcp --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 5m

      - name: Demo smoke after upgrade
        run: >-
          uv run python scripts/smoke_demo.py
          --dev-token demo-token
          --admin-email admin@example.com

      - name: Stop port-forward
        if: always() && steps.pf.outcome != 'skipped'
        run: |
          if [ -f /tmp/port-forward.pid ]; then
            kill "$(cat /tmp/port-forward.pid)" || true
          fi

      - name: Cluster debug logs
        if: failure()
        run: |
          kubectl get pods,events -A
          kubectl logs -l app.kubernetes.io/name=keystone-mcp --all-containers --tail=200 || true

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t keystone-mcp:ci .
      - name: Smoke test image
        run: bash scripts/smoke_image.sh keystone-mcp:ci

  package:
    name: Package build smoke
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Check the built wheel and sdist
        run: uv run --no-project --python 3.12 python scripts/check_version.py --dist-dir dist

      - name: Install the built wheel into a clean virtualenv
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      - name: Smoke test the installed wheel
        run: bash scripts/smoke_wheel.sh /tmp/venv/bin/keystone-mcp

  plugin-template:
    name: Plugin template contract tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install Keystone with contract-tests extra
        run: |
          uv venv /tmp/tpl --python 3.12
          uv pip install --python /tmp/tpl/bin/python ".[contract-tests]"

      - name: Install plugin template and run contract tests
        run: |
          uv pip install --python /tmp/tpl/bin/python ./examples/plugin-template
          cd examples/plugin-template && /tmp/tpl/bin/python -m pytest -q

      - name: List plugin entry points
        run: /tmp/tpl/bin/keystone-mcp plugins list | grep -E "static-file|example-oidc"

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Write demo .env
        run: |
          cat > .env <<'EOT'
          KEYSTONE_DEMO_TOKEN=ci-smoke-token
          KEYSTONE_DEMO_ADMIN_EMAIL=admin@example.com
          EOT

      - name: Start demo stack
        run: docker compose -f docker-compose.demo.yml up -d --build --wait --wait-timeout 180

      - name: Run smoke scenario
        run: >-
          uv run python scripts/smoke_demo.py
          --dev-token ci-smoke-token
          --admin-email admin@example.com

      - name: MCP Python SDK client e2e (modern)
        run: >-
          uv run python scripts/client_e2e.py
          --dev-token ci-smoke-token
          --email member@example.com
          --admin-email admin@example.com
          --protocol modern

      - name: MCP Python SDK client e2e (legacy)
        run: >-
          uv run python scripts/client_e2e.py
          --dev-token ci-smoke-token
          --email member@example.com
          --admin-email admin@example.com
          --protocol legacy

      # OV-F6: Node.js in CI needs product-owner approval (0.5.0 rule). Local check:
      # `claude mcp list` works without ANTHROPIC_API_KEY and shows "Needs authentication".
      - name: Claude Code MCP recognition (OV-F6)
        if: false
        run: echo "Blocked on OV-F6 — add setup-node and claude mcp add/list here"

      - name: Demo stack logs
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color

      - name: Tear down demo stack
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
