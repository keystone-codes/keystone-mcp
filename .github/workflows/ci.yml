name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test-gate.yml

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build -t keystone-mcp:ci .
      - name: Smoke test image
        run: bash scripts/smoke_image.sh keystone-mcp:ci

  package:
    name: Package build smoke
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Check the built wheel and sdist
        run: uv run --no-project --python 3.12 python scripts/check_version.py --dist-dir dist

      - name: Install the built wheel into a clean virtualenv
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      - name: Smoke test the installed wheel
        run: bash scripts/smoke_wheel.sh /tmp/venv/bin/keystone-mcp

  plugin-template:
    name: Plugin template contract tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install Keystone with contract-tests extra
        run: |
          uv venv /tmp/tpl --python 3.12
          uv pip install --python /tmp/tpl/bin/python ".[contract-tests]"

      - name: Install plugin template and run contract tests
        run: |
          uv pip install --python /tmp/tpl/bin/python --no-deps ./examples/plugin-template
          cd examples/plugin-template && /tmp/tpl/bin/python -m pytest -q

      - name: List plugin entry points
        run: /tmp/tpl/bin/keystone-mcp plugins list | grep -E "static-file|example-oidc"

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Write demo .env
        run: |
          cat > .env <<'EOT'
          KEYSTONE_DEMO_TOKEN=ci-smoke-token
          KEYSTONE_DEMO_ADMIN_EMAIL=admin@example.com
          EOT

      - name: Start demo stack
        run: docker compose -f docker-compose.demo.yml up -d --build --wait --wait-timeout 180

      - name: Run smoke scenario
        run: >-
          uv run python scripts/smoke_demo.py
          --dev-token ci-smoke-token
          --admin-email admin@example.com

      - name: Demo stack logs
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color

      - name: Tear down demo stack
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
