name: Test gate

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Version consistency
        run: uv run python scripts/check_version.py

      - name: Lockfile check
        run: uv lock --check

      - name: Frozen baseline matches the v0.5.0 tag
        run: |
          uv run python tests/support/contract_snapshot.py --from-tag v0.5.0 --out "$RUNNER_TEMP/baseline"
          diff -ru "$RUNNER_TEMP/baseline" tests/data/frozen-baseline-0.5.0

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYSTONE_MCP_REDIS_URL: redis://localhost:6379/0
      KEYSTONE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/keystone_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra otel

      - name: Python version
        run: uv run python --version

      - name: RBAC middleware regression gate
        run: >-
          uv run pytest
          tests/test_rbac_middleware_mounted_coverage.py
          tests/test_rbac_middleware.py
          -v

      - name: RBAC conformance regression gate
        env:
          RBAC_CONFORMANCE_WRITE_REPORT: artifacts/rbac-conformance-matrix.md
        run: >-
          uv run pytest
          tests/test_rbac_conformance.py
          -v
          --tb=short

      - name: Upload RBAC conformance matrix artifact
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rbac-conformance-matrix
          path: artifacts/rbac-conformance-matrix.md
          if-no-files-found: ignore

      - name: Users directory on PostgreSQL
        run: >-
          uv run pytest
          tests/test_users_migrations.py
          tests/test_users_domain.py
          tests/test_users_concurrency.py
          tests/integration/test_users_admin_local_smoke.py
          -v
          -rs

      - name: Contract freeze gate
        run: >-
          uv run pytest
          tests/test_contract_freeze.py
          tests/test_contract_freeze_rules.py
          tests/test_env_docs_sync.py
          tests/test_removed_variables.py
          -v

      - name: Full test suite
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.python }}" = "3.12" ]; then
            uv run pytest -q \
              --cov \
              --cov-report=xml:artifacts/coverage.xml \
              --cov-report=term \
              --junitxml=artifacts/junit-py${{ matrix.python }}.xml
          else
            uv run pytest -q --junitxml=artifacts/junit-py${{ matrix.python }}.xml
          fi

      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: artifacts/coverage.xml
          if-no-files-found: error

      - name: Check skipped tests
        run: >-
          uv run python scripts/check_ci_skips.py
          artifacts/junit-py${{ matrix.python }}.xml
          tests/data/ci-allowed-skips.txt
