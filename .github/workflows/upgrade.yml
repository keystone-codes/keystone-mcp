name: Live upgrade stand

on:
  push:
    branches: [master]
  schedule:
    - cron: "42 3 * * *"
  pull_request:
    paths:
      - "src/keystone_mcp/users/migrations/**"
      - "src/keystone_mcp/auth/**"
      - "src/keystone_mcp/users/**"
      - "src/keystone_mcp/config.py"
      - "tests/upgrade/**"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: upgrade-stand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: 0.4.0 → 0.5.0 → current
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Build current image
        run: docker build -t keystone-mcp:upgrade-current .

      - name: Pull published release images
        run: |
          set -euo pipefail
          docker pull ghcr.io/keystone-codes/keystone-mcp:0.5.0
          if ! docker manifest inspect ghcr.io/keystone-codes/keystone-mcp:0.4.0; then
            git archive 5988b51 | tar -x -C /tmp/keystone-v040
            docker build -t ghcr.io/keystone-codes/keystone-mcp:0.4.0 /tmp/keystone-v040
          else
            docker pull ghcr.io/keystone-codes/keystone-mcp:0.4.0
          fi

      - name: Run live upgrade stand
        env:
          KEYSTONE_IMAGE: keystone-mcp:upgrade-current
        run: uv run python tests/upgrade/run_upgrade.py

      - name: Upload version snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upgrade-artifacts
          path: tests/upgrade/artifacts/
          if-no-files-found: ignore
