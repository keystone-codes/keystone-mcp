name: Dependency canary

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Latest dependencies
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYSTONE_MCP_REDIS_URL: redis://localhost:6379/0
      KEYSTONE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/keystone_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Upgrade lock in a temp copy
        run: |
          work="$RUNNER_TEMP/canary-latest"
          cp -r "$GITHUB_WORKSPACE/." "$work"
          cd "$work"
          uv lock --upgrade
          uv sync --extra dev --extra otel

      - name: Print dependency versions
        run: |
          work="$RUNNER_TEMP/canary-latest"
          cd "$work"
          uv run python - <<'PY'
          import importlib.metadata as md

          for name in ("fastmcp", "mcp", "httpx2", "starlette"):
              try:
                  print(f"{name}=={md.version(name)}")
              except md.PackageNotFoundError:
                  print(f"{name}=(not installed)")
          PY

      - name: Pytest (full suite and private API sentinels)
        run: |
          work="$RUNNER_TEMP/canary-latest"
          cd "$work"
          uv run pytest -q
          uv run pytest tests/test_private_api_sentinels.py -v

  prerelease:
    name: Prerelease fastmcp/mcp
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYSTONE_MCP_REDIS_URL: redis://localhost:6379/0
      KEYSTONE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/keystone_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Upgrade lock with prereleases
        run: |
          work="$RUNNER_TEMP/canary-prerelease"
          cp -r "$GITHUB_WORKSPACE/." "$work"
          cd "$work"
          # `--prerelease allow` is a *global* resolver policy, not scoped to
          # the two packages below: with no fastmcp/mcp prerelease published
          # (as of this writing, both are already at their latest stable),
          # it had no effect on them but did let the resolver pick an
          # unrelated, unpinned transitive dependency's prerelease instead
          # (httpx 0.28.1 -> 1.0.dev6, which dropped `httpx.ASGITransport`
          # and broke most of the suite). uv's per-package
          # `--prerelease-package name=allow` flag would scope this
          # correctly, but it needs uv>=0.12.1 and every job in this repo is
          # pinned to the same uv version on purpose (see
          # tests/test_github_workflows.py::test_every_setup_uv_step_pins_one_version).
          # `if-necessary-or-explicit` is the narrower, same-uv-version fix:
          # it only reaches for a prerelease when a stable release cannot
          # satisfy the resolution, so unrelated deps never get bumped into
          # one, and it will still surface a genuine fastmcp/mcp prerelease
          # once one exists and fastmcp/mcp's own bounds require it.
          uv lock --upgrade --upgrade-package fastmcp --upgrade-package mcp --prerelease if-necessary-or-explicit
          uv sync --extra dev --extra otel

      - name: Pytest
        run: |
          work="$RUNNER_TEMP/canary-prerelease"
          cd "$work"
          uv run pytest -q
          uv run pytest tests/test_private_api_sentinels.py -v

  lowest-direct:
    name: Lowest allowed direct deps
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYSTONE_MCP_REDIS_URL: redis://localhost:6379/0
      KEYSTONE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/keystone_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install lowest direct versions
        run: |
          uv venv "$RUNNER_TEMP/canary-low"
          uv pip install --python "$RUNNER_TEMP/canary-low/bin/python" --resolution lowest-direct ".[dev,otel]"

      - name: Pytest
        run: |
          export PATH="$RUNNER_TEMP/canary-low/bin:$PATH"
          # ".[dev,otel]" is installed non-editable into canary-low, so
          # keystone_mcp is physically copied into that venv's site-packages.
          # pytest's own "-p keystone_mcp.contract_tests" addopts plugin
          # imports the keystone_mcp package during early argument parsing,
          # before pyproject.toml's `pythonpath = ["src", ...]` entry is
          # applied -- so without this, keystone_mcp (and anything computing
          # paths from its own __file__, e.g. default_policy_path()) resolves
          # to the throwaway copy in canary-low, not this checkout. Priming
          # PYTHONPATH up front makes the interpreter see src/ first, like an
          # editable install, so the installed non-editable copy is never
          # imported.
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          pytest -q
          pytest tests/test_private_api_sentinels.py -v
