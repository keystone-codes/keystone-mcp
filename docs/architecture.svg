<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Keystone-MCP in an agent application</title>
  <desc id="diagramDesc">MCP clients connect through Keystone-MCP, which authenticates the person, applies a role policy, and routes tool calls to backend services. Those services keep their own logic and storage and do not carry permission labels.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="keystoneWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#064e3b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1040" fill="#020617"/>
  <rect width="1200" height="1040" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="40" fill="#34d399" font-size="12" letter-spacing="2.4">AGENT APPLICATION</text>
    <text x="48" y="70" fill="#f8fafc" font-size="26">One front door, many services behind it</text>
    <text x="48" y="96" fill="#94a3b8" font-size="14">The client is a harness. Each backend speaks MCP. Keystone-MCP is the only server the client sees.</text>

    <!-- Client: every harness sits in this one block -->
    <rect x="32" y="114" width="1136" height="132" rx="18" fill="#03141a" stroke="#155e75" stroke-width="1.5"/>
    <text x="52" y="134" fill="#67e8f9" font-size="12" letter-spacing="1.8">CLIENT</text>

    <g>
      <rect x="48" y="146" width="340" height="86" rx="14" fill="#042f38" stroke="#155e75" stroke-width="1.5"/>
      <text x="68" y="176" fill="#67e8f9" font-size="11" letter-spacing="1.2">HARNESS</text>
      <text x="68" y="204" fill="#f8fafc" font-size="18">Claude Desktop</text>
    </g>
    <g>
      <rect x="430" y="146" width="340" height="86" rx="14" fill="#042f38" stroke="#155e75" stroke-width="1.5"/>
      <text x="450" y="176" fill="#67e8f9" font-size="11" letter-spacing="1.2">HARNESS</text>
      <text x="450" y="204" fill="#f8fafc" font-size="18">Cursor</text>
    </g>
    <g>
      <rect x="812" y="146" width="340" height="86" rx="14" fill="#042f38" stroke="#155e75" stroke-width="1.5"/>
      <text x="832" y="176" fill="#67e8f9" font-size="11" letter-spacing="1.2">HARNESS</text>
      <text x="832" y="204" fill="#f8fafc" font-size="18">Any other MCP client</text>
    </g>

    <!-- Into Keystone-MCP -->
    <line x1="218" y1="232" x2="218" y2="252" stroke="#334155" stroke-width="1.5"/>
    <line x1="600" y1="232" x2="600" y2="252" stroke="#334155" stroke-width="1.5"/>
    <line x1="982" y1="232" x2="982" y2="252" stroke="#334155" stroke-width="1.5"/>
    <line x1="218" y1="252" x2="982" y2="252" stroke="#334155" stroke-width="1.5"/>
    <line x1="600" y1="252" x2="600" y2="284" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="616" y="274" fill="#cbd5e1" font-size="12">MCP · Streamable HTTP · OAuth 2.1 + PKCE</text>

    <!-- Keystone-MCP -->
    <rect x="48" y="292" width="1104" height="348" rx="18" fill="#071410" stroke="#065f46" stroke-width="1.5"/>
    <rect x="49" y="293" width="1102" height="72" rx="17" fill="url(#keystoneWash)"/>
    <circle cx="76" cy="326" r="5" fill="#34d399"/>
    <text x="92" y="332" fill="#f8fafc" font-size="20">keystone-mcp</text>
    <text x="280" y="332" fill="#6ee7b7" font-size="13">facade · router · authentication · authorization</text>

    <!-- Authenticate -->
    <rect x="72" y="356" width="341" height="176" rx="12" fill="#1a0c12" stroke="#9f1239" stroke-width="1.25"/>
    <text x="92" y="384" fill="#fda4af" font-size="11" letter-spacing="1.4">AUTHENTICATE</text>
    <text x="92" y="412" fill="#f8fafc" font-size="16">Who is calling</text>
    <text x="92" y="444" fill="#fecdd3" font-size="13">Google OIDC, optional domain</text>
    <text x="92" y="466" fill="#fecdd3" font-size="13">Built-in token, or introspection</text>
    <text x="92" y="488" fill="#fecdd3" font-size="13">OAuth 2.1 authorization server</text>
    <text x="92" y="510" fill="#fb7185" font-size="12">A client cannot name its own email</text>

    <!-- Authorize -->
    <rect x="429" y="356" width="341" height="176" rx="12" fill="#1a0c12" stroke="#9f1239" stroke-width="1.25"/>
    <text x="449" y="384" fill="#fda4af" font-size="11" letter-spacing="1.4">AUTHORIZE</text>
    <text x="449" y="412" fill="#f8fafc" font-size="16">What they may call</text>
    <text x="449" y="444" fill="#fecdd3" font-size="13">Roles and allow rules: policy file</text>
    <text x="449" y="466" fill="#fecdd3" font-size="13">Who has which role: users directory</text>
    <text x="449" y="488" fill="#fecdd3" font-size="13">Default deny</text>
    <text x="449" y="510" fill="#fb7185" font-size="12">A denied tool is absent from the catalog</text>

    <!-- Route -->
    <rect x="786" y="356" width="342" height="176" rx="12" fill="#052e24" stroke="#047857" stroke-width="1.25"/>
    <text x="806" y="384" fill="#6ee7b7" font-size="11" letter-spacing="1.4">ROUTE</text>
    <text x="806" y="412" fill="#f8fafc" font-size="16">Which section, which tool</text>
    <text x="806" y="444" fill="#a7f3d0" font-size="13">A namespace is a section</text>
    <text x="806" y="466" fill="#a7f3d0" font-size="13">Prefixes publish or hide a family</text>
    <text x="806" y="488" fill="#a7f3d0" font-size="13">One service, several sections</text>
    <text x="806" y="510" fill="#34d399" font-size="12">strip_prefix keeps the name clean</text>

    <!-- Satellites aligned under the three columns -->
    <rect x="72" y="548" width="341" height="68" rx="12" fill="#160b28" stroke="#6d28d9" stroke-width="1.25"/>
    <text x="92" y="574" fill="#ddd6fe" font-size="14">Redis</text>
    <text x="92" y="596" fill="#c4b5fd" font-size="12">OAuth sessions and login state</text>

    <rect x="429" y="548" width="341" height="68" rx="12" fill="#160b28" stroke="#6d28d9" stroke-width="1.25"/>
    <text x="449" y="574" fill="#ddd6fe" font-size="14">Users directory (built in)</text>
    <text x="449" y="596" fill="#c4b5fd" font-size="12">People, block state · SQLite or Postgres</text>

    <rect x="786" y="548" width="342" height="68" rx="12" fill="#1c1408" stroke="#b45309" stroke-width="1.25"/>
    <text x="806" y="574" fill="#fde68a" font-size="14">rbac-policy.yaml</text>
    <text x="806" y="596" fill="#fcd34d" font-size="12">Live refresh + SIGHUP. No restart.</text>

    <!-- One trunk out of Keystone-MCP, then a bus into the backend -->
    <rect x="32" y="688" width="1136" height="212" rx="18" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <line x1="600" y1="640" x2="600" y2="678" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="180" y1="678" x2="1020" y2="678" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="180" y1="678" x2="180" y2="708" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="460" y1="678" x2="460" y2="708" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="740" y1="678" x2="740" y2="708" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="1020" y1="678" x2="1020" y2="708" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="612" y="646" width="124" height="20" rx="6" fill="#071410" stroke="#065f46"/>
    <text x="620" y="660" fill="#a7f3d0" font-size="11">X-Author-Email</text>

    <text x="52" y="706" fill="#cbd5e1" font-size="12" letter-spacing="1.8">BACKEND</text>

    <g>
      <rect x="48" y="716" width="264" height="168" rx="14" fill="#052e24" stroke="#047857" stroke-width="1.25"/>
      <text x="66" y="742" fill="#6ee7b7" font-size="11" letter-spacing="1.2">BUILT IN</text>
      <text x="66" y="768" fill="#f8fafc" font-size="15">Platform tools</text>
      <text x="66" y="796" fill="#a7f3d0" font-size="12">users_* administration</text>
      <text x="66" y="816" fill="#a7f3d0" font-size="12">file links (optional)</text>
      <text x="66" y="844" fill="#34d399" font-size="12">Your file API (optional)</text>
    </g>
    <g>
      <rect x="328" y="716" width="264" height="168" rx="14" fill="#160b28" stroke="#6d28d9" stroke-width="1.25"/>
      <text x="346" y="742" fill="#c4b5fd" font-size="11" letter-spacing="1.2">EXAMPLE · PYTHON</text>
      <text x="346" y="768" fill="#f8fafc" font-size="15">Documents</text>
      <text x="346" y="796" fill="#ddd6fe" font-size="12">MCP tools in front</text>
      <text x="346" y="816" fill="#ddd6fe" font-size="12">Import, render, canon</text>
      <text x="346" y="844" fill="#a78bfa" font-size="12">Postgres · object storage</text>
    </g>
    <g>
      <rect x="608" y="716" width="264" height="168" rx="14" fill="#1c1408" stroke="#b45309" stroke-width="1.25"/>
      <text x="626" y="742" fill="#fcd34d" font-size="11" letter-spacing="1.2">EXAMPLE · GO</text>
      <text x="626" y="768" fill="#f8fafc" font-size="15">Billing</text>
      <text x="626" y="796" fill="#fde68a" font-size="12">MCP tools in front</text>
      <text x="626" y="816" fill="#fde68a" font-size="12">Invoices and payments</text>
      <text x="626" y="844" fill="#fbbf24" font-size="12">Vendor API · no database</text>
    </g>
    <g>
      <rect x="888" y="716" width="264" height="168" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.25"/>
      <text x="906" y="742" fill="#94a3b8" font-size="11" letter-spacing="1.2">EXAMPLE · ANY STACK</text>
      <text x="906" y="768" fill="#f8fafc" font-size="15">Search</text>
      <text x="906" y="796" fill="#cbd5e1" font-size="12">MCP tools in front</text>
      <text x="906" y="816" fill="#cbd5e1" font-size="12">Query the corpus</text>
      <text x="906" y="844" fill="#94a3b8" font-size="12">Search index behind</text>
    </g>

    <!-- Discovery vs policy -->
    <rect x="48" y="924" width="540" height="72" rx="12" fill="#1c1408" stroke="#b45309" stroke-width="1.25"/>
    <text x="68" y="950" fill="#fcd34d" font-size="12" letter-spacing="1.2">CATALOG · LIVE DISCOVERY</text>
    <text x="68" y="974" fill="#fde68a" font-size="13">list_tools() on a timer. New tools need no Keystone-MCP restart.</text>

    <rect x="612" y="924" width="540" height="72" rx="12" fill="#052e24" stroke="#047857" stroke-width="1.25"/>
    <text x="632" y="950" fill="#6ee7b7" font-size="12" letter-spacing="1.2">POLICY · LIVE REFRESH</text>
    <text x="632" y="974" fill="#a7f3d0" font-size="13">File change or SIGHUP. A bad file keeps the last good one.</text>
  </g>
</svg>
