- id: SEC-01
  attack: "Substitute redirect_uri at /authorize and at /token"
  expected: "400 page without redirect for an unregistered URI; invalid_grant when /token gets another URI than /authorize"
  tests:
    - tests/security/test_oauth_redirect.py::test_unregistered_redirect_uri_gets_error_page
    - tests/security/test_oauth_redirect.py::test_token_redirect_uri_mismatch_is_invalid_grant
