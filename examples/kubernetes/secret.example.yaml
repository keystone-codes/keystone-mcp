# Template only -- not applied by kustomization.yaml (checked: no CHANGE_ME
# secret ever lands in your cluster from this directory by itself). Create
# your own Secret with real values instead, for example:
#
#   kubectl create secret generic keystone-secrets -n keystone \
#     --from-literal=KEYSTONE_MCP_LOGIN_GOOGLE_SECRET=... \
#     --from-literal=KEYSTONE_MCP_RBAC_AUDIT_SUBJECT_SALT="$(openssl rand -hex 32)" \
#     --from-literal=KEYSTONE_MCP_REDIS_URL='redis://:<password>@<your-redis-host>:6379/0' \
#     --from-literal=KEYSTONE_MCP_USERS_DB_URL='postgresql+psycopg://keystone:<password>@<your-postgres-host>:5432/keystone'
#
# deployment.yaml reads all four keys through envFrom.secretRef, by the name
# "keystone-secrets" -- keep that name, or edit deployment.yaml to match.
apiVersion: v1
kind: Secret
metadata:
  name: keystone-secrets
  namespace: keystone
type: Opaque
stringData:
  KEYSTONE_MCP_LOGIN_GOOGLE_SECRET: CHANGE_ME
  KEYSTONE_MCP_RBAC_AUDIT_SUBJECT_SALT: CHANGE_ME
  KEYSTONE_MCP_REDIS_URL: redis://:CHANGE_ME@your-redis-host:6379/0
  KEYSTONE_MCP_USERS_DB_URL: postgresql+psycopg://keystone:CHANGE_ME@your-postgres-host:5432/keystone
