# Example manifests, not a Helm chart. Apply with:
#
#   kubectl apply -k examples/kubernetes/
#
# Before that: create the Secret yourself (see secret.example.yaml) and point
# it at your own managed Redis and Postgres -- neither runs in this example.
# ingress.example.yaml is a template, not listed below; copy and adapt it, or
# use your cluster's own ingress/gateway setup.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keystone

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
