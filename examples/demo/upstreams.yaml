# Upstream registry for the demo. Keystone reads it from
# KEYSTONE_MCP_UPSTREAMS_PATH. The URL is plain http on the internal
# Docker network, so the demo sets KEYSTONE_MCP_UPSTREAM_ALLOW_INSECURE_HTTP.
schema_version: 1
entries:
  - name: hello
    url: http://hello-upstream:8081/mcp
    namespace: hello
    enabled: true
    auth:
      # Name of the env var Keystone reads its X-Keystone-Identity signing
      # secret from -- must start with the reserved KEYSTONE_MCP_UPSTREAM_
      # prefix (see upstream_registry/validate.py). docker-compose.demo.yml
      # sets this same variable on Keystone, and HELLO_IDENTITY_SECRET (hello
      # -upstream's own setting) to the same value on hello-upstream, both
      # from the KEYSTONE_DEMO_HELLO_SECRET override.
      identity_secret_env: KEYSTONE_MCP_UPSTREAM_HELLO_IDENTITY_SECRET
  - name: notes
    namespace: notes
    transport: stdio
    command: python
    args: ["/opt/hello-stdio/server.py"]
    cwd: /opt/hello-stdio
    enabled: true
