services:
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports:
      - "16686:16686"
      - "4318:4318"

  keystone-mcp:
    environment:
      KEYSTONE_MCP_OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: keystone-mcp

  hello-upstream:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: hello-upstream
