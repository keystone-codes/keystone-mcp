[project]
name = "keystone-mcp-gateway"
version = "0.5.0"
description = "OAuth 2.1 MCP server that fronts one or more upstream MCP servers with policy-file-driven RBAC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "oauth", "rbac", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.1.0,<5",
    "starlette>=0.37,<2",
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "httpx2>=2.10",
    "prometheus-client>=0.21",
    "pydantic>=2.7,<3",
    "PyJWT[crypto]>=2.15.1",
    "pyyaml>=6.0",
    "redis>=5.0,<9",
    "sqlalchemy>=2.0.43,<3",
    "alembic>=1.16.4,<2",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
keystone-mcp = "keystone_mcp.cli:main"

[project.entry-points."keystone_mcp.login_providers"]
oidc = "keystone_mcp.login.oidc:create_oidc_provider"
google = "keystone_mcp.login.oidc:create_google_provider"
api_key = "keystone_mcp.login.api_key:create_api_key_provider"

[project.entry-points."keystone_mcp.user_directories"]
local = "keystone_mcp.user_directory.local:create_local_directory"
http = "keystone_mcp.user_directory.http:create_http_directory"

[project.urls]
Homepage = "https://github.com/keystone-codes/keystone-mcp"
Source = "https://github.com/keystone-codes/keystone-mcp"
Issues = "https://github.com/keystone-codes/keystone-mcp/issues"

[project.optional-dependencies]
contract-tests = ["pytest>=8.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "coverage[toml]>=7.10",
    "asgi-lifespan>=2.1",
    "ruff>=0.9",
    "hypothesis>=6.100",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B017", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["keystone_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src/keystone_mcp", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "--strict-markers -p keystone_mcp.contract_tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "security: adversarial sign-in, OAuth, and RBAC checklist tests",
    "fuzz: property-based security fuzzing (Hypothesis)",
    "integration: optional live-service tests; skipped when env prerequisites are missing",
    "live_refresh: slow end-to-end live catalog/policy refresh (30s timer)",
    "keystone_contract: Keystone-MCP extension contract test",
]
# fastmcp 4.1.0 declares FastMCPDeprecationWarning in fastmcp._warnings and
# re-exports it from fastmcp.exceptions; pytest imports whichever path is
# given here, and both resolve to the same class. Any remaining camelCase
# field read (nextCursor, inputSchema, ...) or other deprecated fastmcp call
# must fail the suite instead of warning silently.
filterwarnings = [
    "error::fastmcp._warnings.FastMCPDeprecationWarning",
    "error::pytest.PytestUnknownMarkWarning",
    "error::pytest.PytestAssertRewriteWarning",
]

[tool.coverage.run]
source = ["keystone_mcp"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 86
show_missing = false
skip_covered = true
