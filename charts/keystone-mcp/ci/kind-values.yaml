profile: local
baseUrl: http://localhost:8080
replicaCount: 1
secret:
  create: true
  values:
    KEYSTONE_MCP_DEV_TOKENS: demo-token
    KEYSTONE_MCP_RBAC_AUDIT_SUBJECT_SALT: "0123456789abcdef0123456789abcdef"
    KEYSTONE_MCP_REDIS_PASSWORD: demo-redis-password
    KEYSTONE_MCP_REDIS_URL: redis://:demo-redis-password@keystone-keystone-mcp-redis:6379/0
    KEYSTONE_MCP_POSTGRES_PASSWORD: demo-postgres-password
    KEYSTONE_MCP_USERS_DB_URL: postgresql+psycopg://keystone:demo-postgres-password@keystone-keystone-mcp-postgresql:5432/keystone
    KEYSTONE_MCP_UPSTREAM_HELLO_IDENTITY_SECRET: demo-identity-secret-change-me-0123456789
env:
  KEYSTONE_MCP_UPSTREAM_ALLOW_INSECURE_HTTP: "true"
rbac:
  policy: |
    version: "demo-1"
    default_deny: true
    roles:
      administrator:
        description: "Everything, including user administration."
        allow: ["*"]
      member:
        description: "Only the hello service."
        allow: ["hello_*"]
redis:
  enabled: true
postgresql:
  enabled: true
upstreams:
  registry:
    schema_version: 1
    entries:
      - name: hello-upstream
        url: http://hello-upstream:8081/mcp
        namespace: hello
        enabled: true
        auth:
          identity_secret_env: KEYSTONE_MCP_UPSTREAM_HELLO_IDENTITY_SECRET
      - name: notes
        namespace: notes
        transport: stdio
        command: python
        args: ["/opt/hello-stdio/server.py"]
        cwd: /opt/hello-stdio
        enabled: true
