{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keystone-mcp.fullname" . }}-upstream
  labels:
    {{- include "keystone-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- toYaml .Values.networkPolicy.upstream.podSelector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "keystone-mcp.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.upstream.port }}
{{- end }}
