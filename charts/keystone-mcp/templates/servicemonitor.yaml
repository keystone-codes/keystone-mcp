{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "keystone-mcp.fullname" . }}
  labels:
    {{- include "keystone-mcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "keystone-mcp.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
{{- end }}
